# hyprlock — session lock screen.
# Invoked by hypridle's lock_cmd and by the SUPER+M power submap.

general {
    hide_cursor = true
    ignore_empty_input = true
    text_trim = false
}

background {
    monitor =
    path = /home/xiaomin/.config/hypr/pixel_sakura.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
    vibrancy = 0.17
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(f2e9e4ff)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 165
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(f2e9e4cc)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 55
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

# Password input
input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(33ccffee)
    inner_color = rgba(1a1a1acc)
    font_color = rgba(f2e9e4ff)
    font_family = JetBrainsMono Nerd Font
    check_color = rgba(00ff99ee)
    fail_color = rgba(ff5555ee)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    placeholder_text = <i>$USER</i>
    rounding = 10
    position = 0, -50
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

# Battery — laptop, so worth seeing before typing a password
label {
    monitor =
    text = cmd[update:30000] /home/xiaomin/.config/hypr/lock-battery.sh
    color = rgba(f2e9e4cc)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 3
}
