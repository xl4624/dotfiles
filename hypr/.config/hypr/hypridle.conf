general {
    # 3 = "lock notify": hold the sleep inhibitor until the compositor reports
    # the lock surface is actually on screen, via hyprland_lock_notifier_v1.
    # The default (2) only waits for before_sleep_cmd to return, and
    # `loginctl lock-session` returns as soon as it has signalled logind --
    # so the machine could suspend before hyprlock had drawn, leaving the
    # pre-suspend desktop as the last presented frame on resume.
    inhibit_sleep = 3

    lock_cmd = pidof hyprlock || hyprlock       # Avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # Lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # To avoid having to press a key twice to turn on the display.
}

# Every idle action is routed through idle-action.sh so that it only happens
# on battery: plugged in, the machine stays lit, unlocked and awake.

listener {
    timeout = 150                                                                  # 2.5min.
    on-timeout = ~/.config/hypr/idle-action.sh dim brightnessctl -s set 10         # Set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = ~/.config/hypr/idle-action.sh --resume dim brightnessctl -r        # Monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 150                                                                                   # 2.5min.
    on-timeout = ~/.config/hypr/idle-action.sh kbd brightnessctl -sd rgb:kbd_backlight set 0        # Turn off keyboard backlight.
    on-resume = ~/.config/hypr/idle-action.sh --resume kbd brightnessctl -rd rgb:kbd_backlight      # Turn on keyboard backlight.
}

listener {
    timeout = 300                                                                  # 5min
    on-timeout = ~/.config/hypr/idle-action.sh lock loginctl lock-session          # Lock screen when timeout has passed
}

listener {
    timeout = 330                                                                  # 5.5min
    on-timeout = ~/.config/hypr/idle-action.sh dpms hyprctl dispatch dpms off      # Screen off when timeout has passed
    on-resume = ~/.config/hypr/idle-action.sh --resume dpms hyprctl dispatch dpms on # Screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 600                                                                  # 10min
    on-timeout = ~/.config/hypr/idle-action.sh suspend systemctl suspend           # Suspend when timeout has passed
}
