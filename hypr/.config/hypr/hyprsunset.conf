# Blue-light filter schedule.
#
# hyprsunset 0.4 profiles are wall-clock based (no geo/solar calculation),
# so these are fixed times tuned for New York. Adjust seasonally if the
# evening step starts feeling early or late.

max-gamma = 150

profile {
    time = 06:30
    identity = true
}

profile {
    time = 19:00
    temperature = 4500
}

profile {
    time = 22:00
    temperature = 3500
}
