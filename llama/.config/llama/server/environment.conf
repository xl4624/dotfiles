# Read by the packaged user unit (/usr/lib/systemd/user/llama-server.service, EnvironmentFile).
# No model is given, so llama-server runs in router mode: the web UI at http://127.0.0.1:8080
# lists the presets in models.ini and loads the chosen one on demand.
LLAMA_ARG_HOST=127.0.0.1
LLAMA_ARG_PORT=8080
LLAMA_ARG_MODELS_PRESET=/home/xiaomin/.config/llama/server/models.ini
# Unified memory (Radeon 780M shares the 58 GiB RAM, ~33 GiB usable by Vulkan): one model at a time.
LLAMA_ARG_MODELS_MAX=1
# Default CORS is "*" with credentials: any website could drive this server and read replies.
# The built-in web UI is same-origin and unaffected.
LLAMA_ARG_CORS_ORIGINS=localhost
LLAMA_ARG_CORS_CREDENTIALS=false
