[dmenu]
dmenu_command = rofi -i
highlight = True
compact = False
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {name}  {sec}  {icon}
list_saved = True
prompt = Networks

[dmenu_passphrase]
obscure = True
show_pass = kitty --hold sh -c "nmcli device wifi show-password"

[editor]
terminal = kitty
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 5
show_notifications = True
